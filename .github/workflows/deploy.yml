name: Build and Deploy to Production

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        env:
          VITE_API_URL: https://www.zeronix.store/api
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, mysql, zip, pdo_mysql
          tools: composer:v2

      - name: Build Backend
        run: |
          cd backend
          composer install --no-dev --optimize-autoloader
          rm -f bootstrap/cache/*.php

      # Hostinger's Git deployment path is public_html/source, and the
      # domain-root .htaccess (managed manually in hPanel, outside this repo)
      # routes into source/backend and source/frontend/dist. So the
      # `production` branch must mirror that "source" layout exactly:
      #   backend/          -> Laravel app
      #   frontend/dist/    -> built React app
      - name: Prepare Deploy Folder
        env:
          # Passed as an env var (not inlined into the script) because
          # GitHub Actions substitutes ${{ secrets.X }} into the script text
          # *before* bash parses it - special characters in the secret
          # (quotes, &, >, etc.) would otherwise be interpreted as shell
          # syntax instead of literal data.
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          mkdir -p deploy/frontend
          mkdir -p deploy/backend

          # 1. Copy Frontend Build (kept nested under frontend/dist to match
          #    the existing public_html/.htaccess routing rules)
          cp -r frontend/dist deploy/frontend/dist

          # 2. Copy Backend Files
          cp -r backend/* deploy/backend/

          # 3. Inject production .env from the PRODUCTION_ENV repo secret
          printf '%s\n' "$PRODUCTION_ENV" > deploy/backend/.env

          # 4. Create Laravel storage folders (not tracked by git otherwise)
          #    public/storage is a REAL directory here (not a symlink) -
          #    config/filesystems.php points the 'public' disk straight at
          #    public_path('storage'), so nothing needs storage:link.
          mkdir -p deploy/backend/storage/app/public
          mkdir -p deploy/backend/storage/framework/cache
          mkdir -p deploy/backend/storage/framework/sessions
          mkdir -p deploy/backend/storage/framework/views
          mkdir -p deploy/backend/storage/logs
          mkdir -p deploy/backend/public/storage
          touch deploy/backend/storage/app/public/.gitkeep
          touch deploy/backend/storage/framework/cache/.gitkeep
          touch deploy/backend/storage/framework/sessions/.gitkeep
          touch deploy/backend/storage/framework/views/.gitkeep
          touch deploy/backend/storage/logs/.gitkeep
          touch deploy/backend/public/storage/.gitkeep
          chmod -R 775 deploy/backend/storage deploy/backend/public/storage

          # 5. Remove .gitignore files inside deploy to ensure everything is pushed
          find deploy -name ".gitignore" -type f -delete

      - name: Deploy to Production Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: production
          clean: true
          single-commit: false

      - name: Debug Hostinger Secret (temporary - no value printed)
        env:
          HOSTINGER_DEPLOY_HOOK: ${{ secrets.HOSTINGER_DEPLOY_HOOK }}
        run: |
          echo "raw length: ${#HOSTINGER_DEPLOY_HOOK}"
          printf '%s' "$HOSTINGER_DEPLOY_HOOK" | sha256sum
          stripped="$(printf '%s' "$HOSTINGER_DEPLOY_HOOK" | tr -d '[:space:]')"
          echo "stripped length: ${#stripped}"
          printf '%s' "$stripped" | sha256sum
          # expected: length 70, sha256 716bddf8ec7afcaf94725e3f594a2fd1ad81be616316f04b377bc4a145b1b4b

      - name: Trigger Hostinger Deployment
        env:
          HOSTINGER_DEPLOY_HOOK: ${{ secrets.HOSTINGER_DEPLOY_HOOK }}
        run: |
          # Strip any stray whitespace/newlines from the secret (e.g. from
          # copy-paste) so it can't corrupt the URL or the script.
          url="$(printf '%s' "$HOSTINGER_DEPLOY_HOOK" | tr -d '[:space:]')"
          curl -fsS -X POST -H "Content-Type: application/json" -d '{}' "$url"
